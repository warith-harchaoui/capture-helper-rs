<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1237 432" width="1237" height="432" role="img" aria-labelledby="chr-title chr-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="chr-title">How capture-helper-rs works: a microphone in, a stream of typed f32 frames out</title>
  <desc id="chr-desc">A left-to-right plate. In: a microphone plugged into this machine. The work, in three numbered stages: cpal enumerates every input device the host knows about; one of them is opened, either the default or an exact name; and frames are then read, blocking through the iterator or without blocking through try_next_frame. Out: a stream of MicFrame values, each carrying f32 samples normalised to minus one through one, the sample rate, the channel count and a timestamp. Underneath, one crate that forbids unsafe code and documents every public item, standing on cpal with a frame queue bounded at 256. It is reached through three surfaces: a Rust API, a clap command line behind an opt-in feature, and an agent skill. The caption records why that bound exists and what it buys the caller.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="chr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="168" height="78" rx="10"/>
  <text class="n-title" x="112" y="120" text-anchor="middle">a microphone</text>
  <text class="n-sub" x="112" y="139" text-anchor="middle">on this machine</text>
  <path class="flow" d="M202 126 H218" marker-end="url(#chr-arrow)"/>
  <rect class="panel" x="222" y="54" width="772" height="144" rx="12"/>
  <text class="panel-label" x="242" y="76">WHAT IT DOES</text>
  <rect class="stage" x="242" y="94" width="220" height="78" rx="10"/>
  <text class="n-title" x="352" y="127" text-anchor="middle">enumerate</text>
  <text class="n-sub" x="352" y="146" text-anchor="middle">cpal: every input device</text>
  <text class="step" x="253" y="110">1</text>
  <path class="flow" d="M466 133 H482" marker-end="url(#chr-arrow)"/>
  <rect class="stage" x="488" y="94" width="242" height="78" rx="10"/>
  <text class="n-title" x="609" y="127" text-anchor="middle">open one</text>
  <text class="n-sub" x="609" y="146" text-anchor="middle">the default, or an exact name</text>
  <text class="step" x="499" y="110">2</text>
  <path class="flow" d="M734 133 H750" marker-end="url(#chr-arrow)"/>
  <rect class="stage" x="756" y="94" width="218" height="78" rx="10"/>
  <text class="n-title" x="865" y="127" text-anchor="middle">read frames</text>
  <text class="n-sub" x="865" y="146" text-anchor="middle">blocking, or try_next_frame</text>
  <text class="step" x="767" y="110">3</text>
  <path class="flow" d="M1000 126 H1016" marker-end="url(#chr-arrow)"/>
  <text class="panel-label" x="1020" y="40">OUT</text>
  <rect class="io" x="1020" y="87" width="189" height="78" rx="10"/>
  <text class="n-title" x="1114" y="120" text-anchor="middle">a MicFrame stream</text>
  <text class="n-sub" x="1114" y="139" text-anchor="middle">f32, with a timestamp</text>
  <rect class="core" x="392" y="232" width="432" height="54" rx="10"/>
  <text class="on-dark" x="608" y="253" text-anchor="middle">one crate, no unsafe, every item documented</text>
  <text class="on-dark-sub" x="608" y="272" text-anchor="middle">cpal underneath — the frame queue is bounded</text>
  <path class="tie" d="M608 286 V314 H408 V332"/>
  <path class="tie" d="M608 314 H808 V332"/>
  <path class="tie" d="M608 314 V332"/>
  <rect class="surface" x="318" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">Rust API</text>
  <rect class="surface" x="518" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="608" y="360" text-anchor="middle">CLI (clap, opt-in)</text>
  <rect class="surface" x="718" y="332" width="180" height="46" rx="9"/>
  <text class="surf-label" x="808" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="608" y="412" text-anchor="middle">A microphone runs at exactly realtime, so a consumer slower than realtime never catches up. The queue is bounded at 256 frames and the refusals are counted, not lost in silence.</text>
</svg>
