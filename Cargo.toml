[package]
name = "capture-helper-rs"
version = "0.1.2"
edition = "2024"
# Verified, not guessed: `cargo test --all` passes on 1.85.0. Floor set by edition 2024, stable since 1.85.
rust-version = "1.85"
description = "Live microphone capture for Rust: cross-platform device enumeration and a streaming MicFrame API on top of cpal."
license = "BSD-3-Clause"
authors = ["Warith HARCHAOUI <warithmetics@deraison.ai>"]
repository = "https://github.com/warith-harchaoui/capture-helper-rs"
homepage = "https://deraison.ai/ai-helpers"
documentation = "https://docs.rs/capture-helper-rs"
readme = "README.md"
keywords = ["audio", "microphone", "cpal", "capture", "streaming"]
categories = ["multimedia::audio", "hardware-support"]

[dependencies]
cpal = "0.18"
thiserror = "2"
# CLI-only, behind the `cli` feature below: a library consumer should not pay
# for an argument parser or a WAV writer it never calls.
clap = { version = "4", features = ["derive"], optional = true }
hound = { version = "3", optional = true }

[features]
# On by default so `cargo install capture-helper-rs` produces the binary.
# Library users who want neither clap nor hound in their graph depend on this
# crate with `default-features = false`.
default = ["cli"]
cli = ["dep:clap", "dep:hound"]

[[bin]]
# Named after the crate, not after the Python twin's `capture-helper`: the two
# are meant to coexist on one machine, and identical names would make PATH
# order decide which one runs.
name = "capture-helper-rs"
path = "src/main.rs"
required-features = ["cli"]
