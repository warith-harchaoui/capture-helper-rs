[package]
name = "capture-helper-rs"
version = "0.1.2"
edition = "2024"
# Verified, not guessed: `cargo test --all` passes on 1.85.0. Floor set by edition 2024, stable since 1.85.
rust-version = "1.85"
description = "Live microphone capture for Rust: cross-platform device enumeration and a streaming MicFrame API on top of cpal."
license = "BSD-3-Clause"
authors = ["Warith HARCHAOUI"]
repository = "https://github.com/warith-harchaoui/capture-helper-rs"
readme = "README.md"
keywords = ["audio", "microphone", "cpal", "capture", "streaming"]
categories = ["multimedia::audio", "hardware-support"]

[dependencies]
cpal = "0.18"
thiserror = "2"
